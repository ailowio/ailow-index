# Atualizações automáticas de dependência (SEC-10). Formato: version 2 (docs.github.com, Dependabot options reference).
# PRs semanais; minor e patch agrupados num PR só; major vem em PR separado para revisão humana.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencias"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    # Majors travados de propósito (revisar quando o ecossistema permitir):
    # - typescript: o @astrojs/check 0.9.12 só aceita TypeScript 5 ou 6.
    # - @types/node: os tipos acompanham o Node em produção (22, ver .nvmrc), não a última versão.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencias"
      - "ci"
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
