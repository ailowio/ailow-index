# CI do ailow-index (tier A). Regras: CI-01/02/05/07, SEC-05/10.
# Nomes dos jobs são estáveis (viram checks obrigatórios quando houver branch protection).
# Actions fixadas por SHA, as mesmas do ailow-cloud; o comentário diz a versão.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI-07: permissões mínimas; nenhum job precisa de escrita.
permissions:
  contents: read

env:
  # Sem telemetria do Astro no CI.
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # CI-05: npm ci falha se o lockfile estiver fora de sincronia.
      - run: npm ci
      # lint + astro check (tipos) + testes + build.
      - run: npm run verify

  seguranca-sca:
    name: seguranca-sca
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      # SEC-10, mesma política do ailow-cloud: 0 achado alto/crítico em dependência de produção (bloqueia).
      - run: npm audit --omit=dev --audit-level=high
      # Informativo: auditoria completa, incluindo as ferramentas de build. Não bloqueia por causa da
      # exceção EX-02 (docs/excecoes.md): picomatch GHSA-fc5q-39xc-vjpf sem versão corrigida publicada.
      - name: auditoria completa (informativa, EX-02)
        continue-on-error: true
        run: npm audit --audit-level=high

  seguranca-segredos:
    name: seguranca-segredos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # SEC-05: varre o histórico inteiro. Imagem do gitleaks v8.30.1 fixada por digest (igual ao ailow-cloud).
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact --no-banner -v /repo
