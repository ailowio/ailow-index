# CI do ailow-index (tier A). Regras: CI-01/02/05/07, SEC-05/10.
# Nomes dos jobs são estáveis (viram checks obrigatórios quando houver branch protection).
# Actions fixadas por SHA, as mesmas do ailow-cloud; o comentário diz a versão.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI-07: permissões mínimas; nenhum job precisa de escrita.
permissions:
  contents: read

env:
  # Sem telemetria do Astro no CI.
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # CI-05: npm ci falha se o lockfile estiver fora de sincronia.
      - run: npm ci
      # lint + astro check (tipos) + testes + build + orçamento de peso por rota (scripts/peso.mjs).
      - run: npm run verify

  # S04: E2E (Playwright + axe) sobre o build de produção, igual ao que roda local (`npm run e2e`).
  # Job novo e separado: os 4 checks obrigatórios continuam os mesmos até o Pedro decidir torná-lo obrigatório.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Só o chromium, com as bibliotecas do sistema. A versão do navegador segue o @playwright/test fixado.
      - run: npx playwright install --with-deps chromium
      # playwright.config.ts faz `astro build` + `astro preview` (porta 4329).
      - run: npm run e2e

  seguranca-sca:
    name: seguranca-sca
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      # SEC-10, mesma política do ailow-cloud: 0 achado alto/crítico em dependência de produção (bloqueia).
      - run: npm audit --omit=dev --audit-level=high
      # Informativo: auditoria completa, incluindo as ferramentas de build. Não bloqueia por causa da
      # exceção EX-02 (docs/excecoes.md): picomatch GHSA-fc5q-39xc-vjpf sem versão corrigida publicada.
      - name: auditoria completa (informativa, EX-02)
        continue-on-error: true
        run: npm audit --audit-level=high

  seguranca-segredos:
    name: seguranca-segredos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # SEC-05: varre o histórico inteiro. Imagem do gitleaks v8.30.1 fixada por digest (igual ao ailow-cloud).
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact --no-banner -v /repo

  seguranca-sast:
    name: seguranca-sast
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # SEC-10: Semgrep com versão fixa, mesma do ailow-cloud. Bloqueia só severidade ERROR (CI-11).
      - name: semgrep
        run: |
          pipx run --spec semgrep==1.185.0 semgrep scan \
            --config p/default --config p/typescript \
            --severity ERROR --error --metrics=off \
            src scripts

  # S11: imagem de produção (nginx não-root). Constrói, sobe de verdade, roda o smoke e o scan.
  # Orçamentos de JS e de peso por rota já rodam no `verify` (scripts/peso.mjs); não duplicar aqui.
  imagem:
    name: imagem
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: build da imagem
        run: docker build -t ailow-index:ci .
      - name: sobe o container
        run: |
          docker run -d --name site -p 8080:8080 ailow-index:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/health && break
            sleep 1
          done
      # Não-root de verdade: o processo roda com uid diferente de 0.
      - name: container sem root
        run: |
          uid="$(docker exec site id -u)"
          echo "uid=$uid"
          test "$uid" != "0"
      # Rotas, cabeçalhos, CSP por hash, manifest, sw.js, 404 e 405 (scripts/smoke-imagem.mjs).
      - name: smoke
        run: node scripts/smoke-imagem.mjs http://127.0.0.1:8080
      # O log de acesso sai em JSON no stdout, com request_id.
      - name: log de acesso em JSON
        run: |
          docker logs site 2>&1 | grep -E '^\{"time":"[^"]+","request_id":"[0-9a-f]{32}","method":"GET"' | tail -1
      - name: logs do container (diagnóstico)
        if: failure()
        run: docker logs site
      # SEC-12: bloqueia CRITICAL/HIGH com correção disponível (mesma action e versão do ailow-cloud).
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ailow-index:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  # S12: testes do pipeline de deploy sem servidor (docker substituído por atalhos). O canário tem de provar que o
  # teste reprova quando a reversão é quebrada (L-0006): `canario` sai com 0 só se a quebra foi detectada.
  deploy-test:
    name: deploy-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: cenários do deploy.sh e do ssh-entrada.sh
        run: bash scripts/deploy-test.sh
      - name: canário (o teste tem de detectar a reversão quebrada)
        run: bash scripts/deploy-test.sh canario
