# Servidor do site estático (S11): HTTP puro na 8080 (rede interna do Swarm), sem root.
# TLS e HSTS ficam no Traefik. Instalado como /etc/nginx/conf.d/default.conf (contexto http).

# Log de acesso em JSON, uma linha por requisição, com request_id (o mesmo vai no X-Request-Id).
log_format ailow_json escape=json
  '{"time":"$time_iso8601","request_id":"$request_id","method":"$request_method",'
  '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,'
  '"referer":"$http_referer","user_agent":"$http_user_agent","xff":"$http_x_forwarded_for"}';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Redirecionamento de /pedro para /pedro/ sem expor a porta interna atrás do Traefik.
    absolute_redirect off;
    # Site só de leitura: nenhum corpo é aceito.
    client_max_body_size 1k;

    access_log /dev/stdout ailow_json;
    error_log /dev/stderr warn;

    # Hashes dos scripts inline do dist (gerado no build da imagem por scripts/csp.mjs).
    include /etc/nginx/ailow/csp-hashes.conf;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript image/svg+xml application/json application/manifest+json;

    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # Health para o Traefik e o Swarm: texto simples, sem log.
    location = /health {
        access_log off;
        default_type text/plain;
        include /etc/nginx/ailow/seguranca.conf;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    # Nada de arquivo oculto.
    location ~ /\. {
        access_log off;
        return 404;
    }

    # Arquivos com hash no nome (Astro): cache de 1 ano.
    location ^~ /_astro/ {
        include /etc/nginx/ailow/seguranca.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Service worker do cartão: sempre revalidar (senão uma versão velha fica presa no celular).
    location = /cartao/sw.js {
        include /etc/nginx/ailow/seguranca.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Manifest do PWA do cartão: tipo próprio (não depende do mime.types da imagem).
    location = /cartao/manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        include /etc/nginx/ailow/seguranca.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Imagens e ícones sem hash no nome: 7 dias (trocar a foto não fica preso por muito tempo).
    location ~* \.(webp|png|jpg|jpeg|svg|ico)$ {
        include /etc/nginx/ailow/seguranca.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # Páginas: cada rota é um diretório com index.html. HTML sempre revalida.
    location / {
        include /etc/nginx/ailow/seguranca.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
