# Cabeçalhos de segurança (S11). Incluído em TODO location que usa add_header, porque o nginx
# não herda add_header do nível acima quando o location define o seu.
# HSTS fica no Traefik (TLS termina lá); aqui o servidor só fala HTTP na rede interna.
#
# CSP: scripts só do próprio site ou por hash sha256 (variável preenchida por csp-hashes.conf,
# gerado no build a partir do dist/). style-src mantém 'unsafe-inline': o Astro inlina o CSS
# de cada página e há style="--i:N" em atributos, que não aceitam hash sem 'unsafe-hashes'.
# Estilo inline não executa script; o risco aceito está no threat model.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' $csp_script_hashes; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header X-Request-Id $request_id always;
